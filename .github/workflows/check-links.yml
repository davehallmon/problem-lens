name: Check Learn more links

on:
  schedule:
    - cron: "17 14 * * 1"   # Mondays, 14:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "problem-lens/references/learn-more.md"

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check each link in learn-more.md
        run: |
          fail=0
          for url in $(grep -oE 'https?://[^ )]+' problem-lens/references/learn-more.md); do
            code=$(curl -s -o /dev/null -L --max-time 20 -w '%{http_code}' \
              -A "Mozilla/5.0 (problem-lens link check; github.com/davehallmon/problem-lens)" "$url")
            case "$code" in
              2??|3??) echo "OK    $code $url" ;;
              403|429) echo "::warning::Blocked ($code), check by hand: $url" ;;
              *)       echo "::error::Broken ($code): $url"; fail=1 ;;
            esac
          done
          exit $fail
